<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2E6B4F">
<title>Paper Trail — The ACCA Game</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232E6B4F'/%3E%3Cpath d='M8 17 L14 23 L24 9' stroke='%23F2F4EC' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --paper:#F2F4EC; --tint:#E7ECDF; --rule:#C9D4C2; --ink:#1E2B23;
  --faint:#5C6B5F; --ledger:#2E6B4F; --pencil:#C03A2B; --amber:#B07D2B;
  --mono:ui-monospace,"Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.55;
  min-height:100dvh;padding-bottom:72px;overflow-wrap:break-word}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 24px}
a{color:var(--ledger)}
header{display:flex;align-items:baseline;justify-content:space-between;
  border-bottom:2px solid var(--ink);padding:8px 0 10px;margin-bottom:16px}
.brand{font-family:var(--mono);font-weight:700;font-size:1rem;letter-spacing:.14em}
.brand .tick{color:var(--ledger)}
.sub{font-family:var(--mono);font-size:.62rem;letter-spacing:.12em;color:var(--faint);text-transform:uppercase}
.eyebrow{font-family:var(--mono);font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:4px}
h1{font-size:1.5rem;line-height:1.2;margin:2px 0 6px}
h2{font-size:1.05rem;margin:22px 0 8px}
p{margin:0 0 12px}
.muted{color:var(--faint)}
.small{font-size:.85rem}
.back{display:inline-block;font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;
  color:var(--faint);text-decoration:none;margin-bottom:10px}
.back::before{content:"‹ "}
/* cards */
.card{background:var(--paper);border:1.5px solid var(--rule);border-radius:10px;
  padding:14px 15px;margin-bottom:11px;display:block;width:100%;text-align:left;
  color:inherit;text-decoration:none;font:inherit;cursor:pointer}
.card.flat{cursor:default}
.card.tap:active{transform:scale(.995);background:var(--tint)}
.card .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card .nm{font-weight:600}
.card.locked{border-style:dashed;opacity:.85;cursor:default}
.card.empty{border-style:dashed;cursor:default}
.reason{font-size:.82rem;color:var(--amber);margin-top:4px}
.progress{font-family:var(--mono);font-size:.72rem;color:var(--faint);letter-spacing:.03em}
.bar{height:6px;background:var(--tint);border-radius:3px;margin-top:8px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--ledger)}
/* state badges */
.badge{font-family:var(--mono);font-size:.6rem;letter-spacing:.06em;text-transform:uppercase;
  padding:2px 7px;border-radius:20px;border:1.5px solid var(--rule);color:var(--faint);white-space:nowrap}
.badge.exposed{border-color:var(--ledger);color:var(--ledger)}
.badge.understood,.badge.practised{border-color:var(--amber);color:var(--amber)}
.badge.competent,.badge.mastered{background:var(--ledger);color:var(--paper);border-color:var(--ledger)}
/* lesson */
.keypoint{background:var(--tint);border-left:4px solid var(--ledger);border-radius:0 8px 8px 0;
  padding:12px 14px;margin:12px 0}
.keypoint .kt{font-weight:700;margin-bottom:6px}
.keypoint .kt::before{content:"🔑 ";}
.worked{border:1.5px solid var(--rule);border-radius:10px;padding:14px 15px;margin:14px 0}
.worked ol{margin:8px 0 8px 20px}
.worked li{margin-bottom:6px}
.answer{background:var(--paper);border-top:1px dashed var(--rule);padding-top:10px;margin-top:8px}
.breath{font-style:italic;border-top:2px solid var(--ink);padding-top:10px;margin-top:16px}
.forward{font-size:.9rem;color:var(--faint);margin-top:10px}
.forward::before{content:"→ ";color:var(--ledger)}
b,strong{font-weight:700}
/* controls */
.btn{display:inline-block;font:inherit;font-weight:600;background:var(--ledger);color:var(--paper);
  border:none;border-radius:8px;padding:11px 16px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ledger);border:1.5px solid var(--ledger)}
.btn.block{display:block;width:100%;text-align:center;margin:8px 0}
.btn:disabled{opacity:.5;cursor:not-allowed}
.pill{display:inline-block;font-family:var(--mono);font-size:.72rem;letter-spacing:.05em;
  border:1.5px dashed var(--rule);color:var(--faint);border-radius:20px;padding:6px 12px}
.flagbtn{background:transparent;border:1.5px solid var(--rule);color:var(--faint);
  border-radius:8px;padding:9px 13px;font:inherit;cursor:pointer}
.flagbtn::before{content:"⚑ "}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
/* nav */
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--paper);border-top:1.5px solid var(--rule);
  display:flex;max-width:640px;margin:0 auto;padding:env(safe-area-inset-bottom) 0 0}
nav.tabs button{flex:1;background:none;border:none;font:inherit;color:var(--faint);
  padding:10px 4px 12px;cursor:pointer;font-size:.7rem;font-family:var(--mono);letter-spacing:.06em}
nav.tabs button.on{color:var(--ledger);font-weight:700}
/* sheet + toast */
.sheet{position:fixed;inset:0;background:rgba(30,43,35,.4);display:flex;align-items:flex-end;z-index:50}
.sheet .inner{background:var(--paper);width:100%;max-width:640px;margin:0 auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--paper);
  padding:10px 16px;border-radius:8px;font-size:.85rem;z-index:60;max-width:90%}
.banner{background:#F6E2DE;border:1.5px solid var(--pencil);color:#7a241a;border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:.88rem}
.hist{border:1.5px solid var(--rule);border-radius:10px;padding:12px 14px}
.hist .hrow{display:flex;justify-content:space-between;border-top:1px dashed var(--rule);padding:6px 0;font-size:.9rem}
.hist .hrow:first-of-type{border-top:none}
.divider{font-family:var(--mono);font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:18px 0 6px;border-bottom:1px solid var(--rule);padding-bottom:3px}
/* drill runner */
.qstem{font-size:1.08rem;font-weight:600;margin:6px 0 14px}
.opts{display:flex;flex-direction:column;gap:9px;margin-bottom:14px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;font:inherit;color:inherit;
  background:var(--paper);border:1.5px solid var(--rule);border-radius:10px;padding:12px 13px;cursor:pointer;width:100%}
.opt:active{background:var(--tint)}
.opt .ol{font-family:var(--mono);font-weight:700;color:var(--faint);flex:none;min-width:1.1em}
.opt.chosen{border-color:var(--ledger);background:var(--tint)}
.opt.chosen .ol{color:var(--ledger)}
.opt.correct{border-color:var(--ledger);background:#E4EFE6}
.opt.correct .ol{color:var(--ledger)}
.opt.wrong{border-color:var(--pencil);background:#F6E2DE}
.opt.wrong .ol{color:var(--pencil)}
.opt.dim{opacity:.55}
.opt:disabled{cursor:default}
.hint{background:var(--tint);border-left:4px solid var(--amber);border-radius:0 8px 8px 0;padding:10px 13px;margin:0 0 12px}
.hint ol{margin:4px 0 0 18px}.hint li{margin-bottom:4px}
.btn.small{padding:8px 12px;font-size:.85rem;margin-bottom:12px}
.verdict{font-weight:700;font-size:1.05rem;margin:4px 0 8px}
.verdict.ok{color:var(--ledger)}.verdict.no{color:var(--pencil)}
.rationale{border-top:1px dashed var(--rule);padding-top:10px;margin-bottom:8px}
.diag{border:1.5px solid var(--rule);border-left:4px solid var(--pencil);border-radius:0 8px 8px 0;padding:12px 14px;margin:12px 0}
.diag .cause{font-weight:700}
.diag ul{margin:4px 0 10px 18px}.diag li{margin-bottom:4px}
.promote{background:var(--ledger);color:var(--paper);border-radius:8px;padding:10px 13px;margin:12px 0;font-size:.95rem}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="muted">Loading…</p></div>
<script type="module" src="./app.js"></script>
<script>
// Service worker — register and reload once when a new version takes control (smooth cutover).
if ('serviceWorker' in navigator) {
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (reloaded) return; reloaded = true; location.reload();
  });
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
</script>
</body>
</html>
